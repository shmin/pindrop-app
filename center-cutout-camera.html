<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0e" />
  <title>중앙 누끼 카메라</title>
  <style>
    :root { color-scheme: dark; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080a0e; color: #fff; }
    body { display: grid; place-items: center; overflow: hidden; }
    button { font: inherit; }
    .app { position: relative; width: min(100vw, 480px); height: 100dvh; min-height: 560px; overflow: hidden; background: #11151b; }
    .camera { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #25303b, #0e1116 72%); }
    video, .mask { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    video { transform: scaleX(1); }
    .mask { pointer-events: none; }
    .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.7), transparent 22%, transparent 68%, rgba(0,0,0,.82)); }
    header { position: absolute; z-index: 3; top: 0; left: 0; right: 0; padding: max(18px, env(safe-area-inset-top)) 18px 0; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .live { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid rgba(255,255,255,.15); border-radius: 999px; background: rgba(8,10,14,.48); backdrop-filter: blur(14px); color: #cbd2dc; font-size: 11px; font-weight: 750; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #7a8592; }
    .live.on .dot { background: #46ef9b; box-shadow: 0 0 0 5px rgba(70,239,155,.12); }
    .target { position: absolute; z-index: 2; left: 50%; top: 46%; width: 46px; height: 46px; transform: translate(-50%, -50%); pointer-events: none; }
    .target::before, .target::after { content: ""; position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,.94); box-shadow: 0 0 8px rgba(0,0,0,.45); border-radius: 2px; }
    .target::before { width: 24px; height: 2px; transform: translate(-50%, -50%); }
    .target::after { width: 2px; height: 24px; transform: translate(-50%, -50%); }
    .target.locked::before, .target.locked::after { background: #46ef9b; }
    .guide { position: absolute; z-index: 3; left: 18px; right: 18px; bottom: 138px; text-align: center; }
    .status { display: inline-flex; align-items: center; min-height: 36px; padding: 9px 14px; border-radius: 999px; background: rgba(8,10,14,.58); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px); color: #edf1f5; font-size: 13px; font-weight: 700; }
    .status.good { color: #8affbc; border-color: rgba(70,239,155,.26); }
    .controls { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; min-height: 126px; padding: 8px 26px max(22px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 92px 1fr; align-items: center; }
    .minor { justify-self: center; border: 0; background: transparent; color: #e8edf2; font-size: 12px; font-weight: 700; padding: 12px 6px; opacity: .9; }
    .minor:disabled { opacity: .35; }
    .shutter { width: 78px; height: 78px; justify-self: center; border: 3px solid #fff; border-radius: 50%; background: rgba(255,255,255,.18); padding: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
    .shutter::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform .15s, background .2s; }
    .shutter:active::after { transform: scale(.88); }
    .shutter:disabled { opacity: .45; }
    .shutter.ready::after { background: #46ef9b; }
    .start { position: absolute; z-index: 5; inset: 0; display: grid; place-content: center; gap: 14px; padding: 34px; text-align: center; background: radial-gradient(circle at 50% 40%, #24313d, #090b0f 70%); }
    .start.hidden { display: none; }
    .start h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); letter-spacing: -.055em; }
    .start p { margin: 0 0 12px; color: #aeb8c4; font-size: 14px; line-height: 1.65; }
    .start button { border: 0; border-radius: 16px; padding: 16px 22px; background: #46ef9b; color: #06110b; font-weight: 900; font-size: 16px; }
    .start small { color: #7f8a97; font-size: 11px; }
    dialog { width: min(calc(100% - 28px), 430px); border: 1px solid rgba(255,255,255,.13); border-radius: 24px; padding: 0; overflow: hidden; color: #fff; background: #12161d; box-shadow: 0 28px 80px rgba(0,0,0,.65); }
    dialog::backdrop { background: rgba(0,0,0,.74); backdrop-filter: blur(8px); }
    .result-img { width: 100%; max-height: 56dvh; display: block; object-fit: contain; background-color: #eef1f4; background-image: linear-gradient(45deg,#d6dbe0 25%,transparent 25%),linear-gradient(-45deg,#d6dbe0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6dbe0 75%),linear-gradient(-45deg,transparent 75%,#d6dbe0 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
    .result-body { padding: 18px; }
    .result-body h2 { margin: 0 0 6px; font-size: 19px; }
    .result-body p { margin: 0 0 16px; color: #9fa9b5; font-size: 13px; }
    .result-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
    .result-actions button, .result-actions a { display: grid; place-items: center; min-height: 48px; border: 0; border-radius: 14px; text-decoration: none; font-weight: 850; font-size: 14px; }
    .again { background: #252b34; color: #fff; }
    .save { background: #46ef9b; color: #06110b; }
    .toast { position: absolute; z-index: 8; left: 50%; top: 92px; transform: translateX(-50%) translateY(-12px); width: max-content; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 12px; background: #f2f4f6; color: #14181d; font-size: 12px; font-weight: 750; opacity: 0; pointer-events: none; transition: .25s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <main class="app">
    <section class="camera">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="mask" class="mask"></canvas>
      <div class="shade"></div>
    </section>

    <header>
      <div class="brand">CENTER CUT</div>
      <div class="live" id="liveBadge"><span class="dot"></span><span id="fps">준비 중</span></div>
    </header>

    <div class="target" id="target" aria-hidden="true"></div>
    <div class="guide"><span class="status" id="status">물체를 중앙에 맞춰주세요</span></div>

    <div class="controls">
      <button class="minor" id="flip" type="button">카메라 전환</button>
      <button class="shutter" id="capture" type="button" aria-label="누끼 사진 촬영" disabled></button>
      <button class="minor" id="clear" type="button">표시 끄기</button>
    </div>

    <section class="start" id="startPanel">
      <h1>중앙의 물체만<br>쏙 저장하세요</h1>
      <p>카메라 중앙에 물체를 맞추면<br>AI가 실시간으로 누끼 영역을 표시합니다.</p>
      <button id="start" type="button">카메라 시작</button>
      <small>사진은 기기 안에서 처리되며 서버로 업로드하지 않습니다.</small>
    </section>

    <div class="toast" id="toast"></div>

    <dialog id="resultDialog">
      <img id="resultImage" class="result-img" alt="배경이 제거된 촬영 결과" />
      <div class="result-body">
        <h2>누끼 저장 준비 완료</h2>
        <p>체크무늬 부분은 실제 파일에서 투명하게 저장됩니다.</p>
        <div class="result-actions">
          <button class="again" id="again" type="button">다시 촬영</button>
          <a class="save" id="download" download="center-cut.png">PNG 저장</a>
        </div>
      </div>
    </dialog>
  </main>

  <script type="module">
    import { FilesetResolver, InteractiveSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";

    const $ = (id) => document.getElementById(id);
    const video = $("video");
    const overlay = $("mask");
    const overlayCtx = overlay.getContext("2d");
    const startPanel = $("startPanel");
    const statusEl = $("status");
    const targetEl = $("target");
    const captureBtn = $("capture");
    const liveBadge = $("liveBadge");
    const fpsEl = $("fps");
    const resultDialog = $("resultDialog");
    const resultImage = $("resultImage");
    const download = $("download");
    const toast = $("toast");

    let stream;
    let segmenter;
    let facingMode = "environment";
    let busy = false;
    let running = false;
    let visibleMask = true;
    let lastInference = 0;
    let latestMask = null;
    let latestMaskSize = { width: 0, height: 0 };
    let lastResultAt = 0;
    let averageMs = 0;
    let objectFound = false;

    function message(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(message.timer);
      message.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function setStatus(text, good = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("good", good);
      targetEl.classList.toggle("locked", good);
      captureBtn.classList.toggle("ready", good);
      captureBtn.disabled = !good;
    }

    function fitOverlay() {
      const rect = overlay.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const w = Math.round(rect.width * dpr);
      const h = Math.round(rect.height * dpr);
      if (overlay.width !== w || overlay.height !== h) {
        overlay.width = w;
        overlay.height = h;
      }
    }

    function drawCover(source, ctx, targetW, targetH) {
      const sw = source.width, sh = source.height;
      const scale = Math.max(targetW / sw, targetH / sh);
      const dw = sw * scale, dh = sh * scale;
      ctx.drawImage(source, (targetW - dw) / 2, (targetH - dh) / 2, dw, dh);
    }

    function buildMask(maskArray, width, height, showFill = true) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(width, height);
      let selected = 0;
      let minX = width, minY = height, maxX = -1, maxY = -1;
      const stride = width;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const p = y * stride + x;
          if (maskArray[p] !== 0) continue;
          selected++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          const edge = x === 0 || y === 0 || x === width - 1 || y === height - 1 ||
            maskArray[p - 1] !== 0 || maskArray[p + 1] !== 0 ||
            maskArray[p - stride] !== 0 || maskArray[p + stride] !== 0;
          const i = p * 4;
          image.data[i] = edge ? 50 : 34;
          image.data[i + 1] = edge ? 255 : 239;
          image.data[i + 2] = edge ? 154 : 145;
          image.data[i + 3] = edge ? 255 : (showFill ? 72 : 0);
        }
      }
      ctx.putImageData(image, 0, 0);
      return { canvas, coverage: selected / maskArray.length, bounds: { minX, minY, maxX, maxY } };
    }

    function handleResult(result) {
      const categoryMask = result.categoryMask;
      if (!categoryMask) return;
      const width = categoryMask.width;
      const height = categoryMask.height;
      const data = categoryMask.getAsUint8Array();
      const visual = buildMask(data, width, height, true);
      latestMask = new Uint8Array(data);
      latestMaskSize = { width, height };
      categoryMask.close();

      objectFound = visual.coverage > 0.008 && visual.coverage < 0.82;
      fitOverlay();
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (visibleMask && objectFound) drawCover(visual.canvas, overlayCtx, overlay.width, overlay.height);
      setStatus(objectFound ? "물체를 찾았어요 · 촬영할 수 있어요" : "물체를 중앙에 맞춰주세요", objectFound);
      lastResultAt = performance.now();
    }

    async function loadModel() {
      setStatus("누끼 AI를 불러오는 중입니다");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );
      const options = {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-tasks/interactive_segmenter/ptm_512_hdt_ptm_woid.tflite",
          delegate: "GPU"
        },
        runningMode: "IMAGE",
        outputCategoryMask: true,
        outputConfidenceMasks: false
      };
      try {
        segmenter = await InteractiveSegmenter.createFromOptions(vision, options);
      } catch (error) {
        options.baseOptions.delegate = "CPU";
        segmenter = await InteractiveSegmenter.createFromOptions(vision, options);
      }
    }

    async function openCamera() {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 1920 } }
      });
      video.srcObject = stream;
      await video.play();
    }

    function loop(now) {
      if (!running) return;
      requestAnimationFrame(loop);
      if (!segmenter || busy || video.readyState < 2 || now - lastInference < 180) return;
      busy = true;
      const started = performance.now();
      try {
        segmenter.segment(video, { keypoint: { x: 0.5, y: 0.46 } }, handleResult);
        const elapsed = performance.now() - started;
        averageMs = averageMs ? averageMs * .72 + elapsed * .28 : elapsed;
        fpsEl.textContent = `${Math.max(1, Math.round(1000 / Math.max(180, averageMs)))} FPS 누끼`;
        liveBadge.classList.add("on");
      } catch (error) {
        console.error(error);
      } finally {
        busy = false;
        lastInference = performance.now();
      }
    }

    async function startApp() {
      if (!navigator.mediaDevices?.getUserMedia) {
        message("이 브라우저에서는 카메라를 사용할 수 없습니다.");
        return;
      }
      $("start").disabled = true;
      $("start").textContent = "카메라를 여는 중…";
      try {
        await Promise.all([openCamera(), loadModel()]);
        startPanel.classList.add("hidden");
        running = true;
        fitOverlay();
        requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        $("start").disabled = false;
        $("start").textContent = "다시 시도";
        message("카메라 권한과 인터넷 연결을 확인해주세요.");
      }
    }

    function createAlphaMask(data, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      const image = ctx.createImageData(width, height);
      for (let p = 0; p < data.length; p++) image.data[p * 4 + 3] = data[p] === 0 ? 255 : 0;
      ctx.putImageData(image, 0, 0);
      return canvas;
    }

    async function captureCutout() {
      if (!latestMask || !objectFound || busy) return;
      captureBtn.disabled = true;
      setStatus("촬영한 사진을 정리하고 있어요", true);

      const source = document.createElement("canvas");
      source.width = video.videoWidth;
      source.height = video.videoHeight;
      source.getContext("2d").drawImage(video, 0, 0);

      let preciseMask = latestMask;
      let maskW = latestMaskSize.width;
      let maskH = latestMaskSize.height;
      try {
        segmenter.segment(source, { keypoint: { x: 0.5, y: 0.46 } }, (result) => {
          if (result.categoryMask) {
            maskW = result.categoryMask.width;
            maskH = result.categoryMask.height;
            preciseMask = new Uint8Array(result.categoryMask.getAsUint8Array());
            result.categoryMask.close();
          }
        });
      } catch (error) { console.warn("정밀 누끼 대신 최신 마스크를 사용합니다.", error); }

      let minX = maskW, minY = maskH, maxX = 0, maxY = 0;
      for (let y = 0; y < maskH; y++) for (let x = 0; x < maskW; x++) {
        if (preciseMask[y * maskW + x] === 0) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      const pad = Math.round(Math.max(maskW, maskH) * .025);
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(maskW - 1, maxX + pad); maxY = Math.min(maskH - 1, maxY + pad);
      const sx = Math.floor(minX / maskW * source.width);
      const sy = Math.floor(minY / maskH * source.height);
      const sw = Math.max(1, Math.ceil((maxX - minX + 1) / maskW * source.width));
      const sh = Math.max(1, Math.ceil((maxY - minY + 1) / maskH * source.height));

      const output = document.createElement("canvas");
      output.width = sw; output.height = sh;
      const ctx = output.getContext("2d");
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, sw, sh);
      ctx.globalCompositeOperation = "destination-in";
      const alpha = createAlphaMask(preciseMask, maskW, maskH);
      ctx.drawImage(alpha, minX, minY, maxX - minX + 1, maxY - minY + 1, 0, 0, sw, sh);
      ctx.globalCompositeOperation = "source-over";

      const blob = await new Promise((resolve) => output.toBlob(resolve, "image/png"));
      const url = URL.createObjectURL(blob);
      if (download.href?.startsWith("blob:")) URL.revokeObjectURL(download.href);
      download.href = url;
      resultImage.src = url;
      resultDialog.showModal();
      setStatus("물체를 찾았어요 · 촬영할 수 있어요", true);
      captureBtn.disabled = false;
    }

    $("start").addEventListener("click", startApp);
    $("capture").addEventListener("click", captureCutout);
    $("again").addEventListener("click", () => resultDialog.close());
    $("flip").addEventListener("click", async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      setStatus("카메라를 전환하는 중입니다");
      try { await openCamera(); } catch { message("카메라를 전환하지 못했습니다."); }
    });
    $("clear").addEventListener("click", (event) => {
      visibleMask = !visibleMask;
      event.currentTarget.textContent = visibleMask ? "표시 끄기" : "표시 켜기";
      if (!visibleMask) overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
    });
    window.addEventListener("resize", fitOverlay);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) liveBadge.classList.remove("on");
    });
  </script>
</body>
</html>
